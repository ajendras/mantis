<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="Mantis — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">Mantis — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#5c4033">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.50s steps(11) 0.60s forwards" fill="#e5e7eb">mantis init</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.40s forwards" fill="#94a3b8">Created .mantis/config.toml with defaults for Ollama + llama3</text>
<text x="50" y="126" class="l" style="animation:show .01s 1.62s forwards" fill="#94a3b8">Repository context indexed (12 issues, 8 PRs)</text>
<text x="50" y="152" class="l" style="animation:show .01s 1.84s forwards" fill="#94a3b8">Ready. Run &apos;mantis triage&apos; on any open issue.</text>
<text x="28" y="204" class="l" style="animation:show .01s 2.41s forwards"><tspan fill="#5c4033">❯</tspan></text><text x="50" y="204" class="l ty" style="animation:show .01s 2.41s forwards,type 2.20s steps(52) 2.41s forwards" fill="#e5e7eb">mantis triage --repo octocat/Hello-World --issue 123</text>
<text x="50" y="230" class="l" style="animation:show .01s 4.91s forwards" fill="#94a3b8">Analyzing issue #123: &apos;Bug: login fails on Safari&apos;</text>
<text x="50" y="256" class="l" style="animation:show .01s 5.13s forwards" fill="#94a3b8">→ Suggested labels: bug, browser-compatibility, needs-repro</text>
<text x="50" y="282" class="l" style="animation:show .01s 5.35s forwards" fill="#94a3b8">→ Duplicate confidence 68% with #89 (closed with patch)</text>
<text x="50" y="308" class="l" style="animation:show .01s 5.57s forwards" fill="#94a3b8">→ Priority: high</text>
<text x="28" y="360" class="l" style="animation:show .01s 6.14s forwards"><tspan fill="#5c4033">❯</tspan></text><text x="50" y="360" class="l ty" style="animation:show .01s 6.14s forwards,type 2.16s steps(48) 6.14s forwards" fill="#e5e7eb">mantis review --repo octocat/Hello-World --pr 45</text>
<text x="50" y="386" class="l" style="animation:show .01s 8.60s forwards" fill="#94a3b8">Reviewing PR #45 (3 files changed)</text>
<text x="50" y="412" class="l" style="animation:show .01s 8.82s forwards" fill="#94a3b8">→ LGTM with 2 suggestions</text>
<text x="50" y="438" class="l" style="animation:show .01s 9.04s forwards" fill="#94a3b8">Line 67: consider using contextlib.nullcontext instead</text>
<text x="50" y="464" class="l" style="animation:show .01s 9.26s forwards" fill="#94a3b8">Security note: no new secrets or privileged endpoints introduced</text>
<text x="28" y="516" class="l" style="animation:show .01s 9.83s forwards"><tspan fill="#5c4033">❯</tspan></text><text x="50" y="516" class="l ty" style="animation:show .01s 9.83s forwards,type 1.08s steps(24) 9.83s forwards" fill="#e5e7eb">mantis digest --since 7d</text>
<g class="l" style="animation:show .01s 11.21s forwards"><text x="28" y="542" fill="#5c4033">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
